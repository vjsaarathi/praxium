[package]
name = "praxium"
version = "0.1.0"
edition = "2024"

[dependencies]
json-patch = "4.2.0"
jsonschema = { version = "0.60.2", default-features = false }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
